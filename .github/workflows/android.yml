name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew || true
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kavach-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release builds need a keystore. Add these as repository secrets and never
      # commit the keystore itself:
      #   KAVACH_KEYSTORE_BASE64, KAVACH_KEYSTORE_PASSWORD, KAVACH_KEY_ALIAS, KAVACH_KEY_PASSWORD
